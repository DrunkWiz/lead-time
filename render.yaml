# Render Blueprint: one free web service, built from the Dockerfile.
# Render dashboard → New → Blueprint → pick this repo. It asks for the secret values once.
services:
  - type: web
    name: lead-time
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/meta
    autoDeploy: true
    envVars:
      - key: LT_PROVIDER_CHAIN
        value: soclaas,gemini
      - key: SOCLAAS_API_KEY
        sync: false
      - key: SOCLAAS_BASE_URL
        sync: false
      - key: SOCLAAS_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
